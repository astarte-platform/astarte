# Tests for the Astarte authorization model. Run them with:
#
#   ./astarte-fga.sh test
#
# They evaluate the model offline (no OpenFGA server and no Astarte cluster
# needed), so they assert what the model *means*, which is the part most likely
# to be wrong.

name: Astarte authorization model

model_file: ./authorization_model.fga

tuples:
  # --- the cluster and two realms ----------------------------------------
  - user: cluster:astarte
    relation: parent
    object: realm:testrealm
  - user: cluster:astarte
    relation: parent
    object: realm:otherrealm

  # --- resources in testrealm -------------------------------------------
  - user: realm:testrealm
    relation: realm
    object: device_group:testrealm/line4
  - user: realm:testrealm
    relation: realm
    object: device:testrealm/dev1
  - user: realm:testrealm
    relation: realm
    object: device:testrealm/dev2
  - user: device_group:testrealm/line4
    relation: group
    object: device:testrealm/dev1
  - user: realm:testrealm
    relation: realm
    object: interface:testrealm/com.my.Commands
  - user: realm:testrealm
    relation: realm
    object: interface:testrealm/com.my.Telemetry
  - user: realm:testrealm
    relation: realm
    object: trigger:testrealm/connection
  - user: realm:testrealm
    relation: realm
    object: trigger_policy:testrealm/retry

  # a device in the other realm, with the same device id as dev1
  - user: realm:otherrealm
    relation: realm
    object: device:otherrealm/dev1

  # --- role assignments --------------------------------------------------
  # root administers the whole cluster
  - user: user:_cluster/root
    relation: admin
    object: cluster:astarte

  # alice administers testrealm
  - user: user:testrealm/alice
    relation: admin
    object: realm:testrealm

  # dave runs the fleet in testrealm
  - user: user:testrealm/dave
    relation: fleet_manager
    object: realm:testrealm

  # bob may send data, but only to the devices of one group
  - user: user:testrealm/bob
    relation: data_writer
    object: device_group:testrealm/line4

  # frank may send data, but only on one interface
  - user: user:testrealm/frank
    relation: data_writer
    object: interface:testrealm/com.my.Commands

  # erin may only read FDO material
  - user: user:testrealm/erin
    relation: fdo_viewer
    object: realm:testrealm

  # the on-call team observes testrealm, and contains the SRE team,
  # which carol belongs to - two levels of nesting
  - user: team:oncall#member
    relation: observer
    object: realm:testrealm
  - user: team:sre#member
    relation: member
    object: team:oncall
  - user: user:testrealm/carol
    relation: member
    object: team:sre

tests:
  # ======================================================================
  - name: a realm administrator gets every realm capability except the cluster's
    check:
      - user: user:testrealm/alice
        object: realm:testrealm
        assertions:
          can_read_realm: true
          can_read_realm_config: true
          can_update_realm_config: true
          can_install_interface: true
          can_create_trigger: true
          can_create_trigger_policy: true
          can_register_device: true
          can_list_devices: true
          can_create_device_group: true
          can_manage_fdo: true
          can_read_fdo: true
          can_join_room: true
          # deleting or updating the realm itself belongs to the cluster
          can_update_realm: false
          can_delete_realm: false

  # ======================================================================
  - name: replacing the realm public key is admin only, never another role
    check:
      - user: user:testrealm/dave
        object: realm:testrealm
        assertions:
          can_update_realm_config: false
          can_read_realm_config: false
      - user: user:testrealm/carol
        object: realm:testrealm
        assertions:
          # an observer reads the config but must never replace the key
          can_read_realm_config: true
          can_update_realm_config: false
      - user: user:testrealm/bob
        object: realm:testrealm
        assertions:
          can_update_realm_config: false

  # ======================================================================
  - name: erasing a device is admin only, unregistering it is the fleet manager's
    check:
      - user: user:testrealm/dave
        object: device:testrealm/dev1
        assertions:
          can_unregister: true
          can_update: true
          can_read: true
          # DELETE /devices/:id destroys data - not a fleet operation
          can_delete: false
      - user: user:testrealm/alice
        object: device:testrealm/dev1
        assertions:
          can_delete: true
          can_unregister: true

  # ======================================================================
  - name: a cluster administrator inherits into every realm, and owns the realm lifecycle
    check:
      - user: user:_cluster/root
        object: cluster:astarte
        assertions:
          can_create_realm: true
          can_list_realms: true
          can_read_cluster_config: true
      - user: user:_cluster/root
        object: realm:testrealm
        assertions:
          can_update_realm: true
          can_delete_realm: true
          can_update_realm_config: true
          can_register_device: true
      - user: user:_cluster/root
        object: realm:otherrealm
        assertions:
          can_delete_realm: true
          can_read_realm: true

  # ======================================================================
  - name: a device group grant scopes a user to that slice of the fleet only
    check:
      - user: user:testrealm/bob
        object: device:testrealm/dev1
        assertions:
          can_write_data: true
          can_read_data: true
          can_read: true
      - user: user:testrealm/bob
        object: device:testrealm/dev2
        assertions:
          # dev2 is in no group, so the group grant must not reach it
          can_write_data: false
          can_read_data: false
          can_read: false
      - user: user:testrealm/bob
        object: device_group:testrealm/line4
        assertions:
          can_read: true
          # writing data is not managing the group's membership
          can_update: false

  # ======================================================================
  - name: an interface grant scopes a user to that interface only
    check:
      - user: user:testrealm/frank
        object: interface:testrealm/com.my.Commands
        assertions:
          can_write_data: true
          can_read_data: true
          can_read: true
          # sending data is not changing the interface definition
          can_update: false
          can_delete: false
      - user: user:testrealm/frank
        object: interface:testrealm/com.my.Telemetry
        assertions:
          can_write_data: false
          can_read_data: false

  # ======================================================================
  - name: the two checks that gate data access are independent
    # The service requires both; neither alone is sufficient, and the model
    # must answer them separately.
    check:
      - user: user:testrealm/frank
        object: device:testrealm/dev1
        assertions:
          # frank holds the interface half but not the device half
          can_write_data: false
      - user: user:testrealm/bob
        object: interface:testrealm/com.my.Commands
        assertions:
          # bob holds the device half but not the interface half
          can_write_data: false

  # ======================================================================
  - name: team membership nests, and grants the team's role
    check:
      - user: user:testrealm/carol
        object: realm:testrealm
        assertions:
          can_read_realm: true
          can_list_interfaces: true
          can_list_triggers: true
          can_list_devices: true
          can_read_stats: true
          can_join_room: true
          # an observer writes nothing
          can_install_interface: false
          can_create_trigger: false
          can_register_device: false
          can_create_device_group: false
      - user: user:testrealm/carol
        object: device:testrealm/dev1
        assertions:
          can_read: true
          can_read_data: true
          can_write_data: false
          can_unregister: false
          can_delete: false

  # ======================================================================
  - name: writing data implies reading it, but reading never implies writing
    check:
      - user: user:testrealm/bob
        object: device:testrealm/dev1
        assertions:
          can_write_data: true
          can_read_data: true
      - user: user:testrealm/carol
        object: device:testrealm/dev1
        assertions:
          can_read_data: true
          can_write_data: false

  # ======================================================================
  - name: fdo_manager implies fdo_viewer, and the reverse never holds
    check:
      - user: user:testrealm/erin
        object: realm:testrealm
        assertions:
          can_read_fdo: true
          can_manage_fdo: false
      - user: user:testrealm/alice
        object: realm:testrealm
        assertions:
          can_read_fdo: true
          can_manage_fdo: true

  # ======================================================================
  - name: grants never cross realms, even for an identical device id
    check:
      - user: user:testrealm/alice
        object: realm:otherrealm
        assertions:
          can_read_realm: false
          can_register_device: false
          can_update_realm_config: false
      - user: user:testrealm/alice
        object: device:otherrealm/dev1
        assertions:
          # the same device id in another realm must be a different object
          can_read: false
          can_delete: false
          can_unregister: false
      - user: user:testrealm/bob
        object: device:otherrealm/dev1
        assertions:
          can_write_data: false

  # ======================================================================
  - name: a user with no tuples can do nothing
    check:
      - user: user:testrealm/mallory
        object: realm:testrealm
        assertions:
          can_read_realm: false
          can_read_realm_config: false
          can_list_devices: false
          can_register_device: false
          can_read_fdo: false
          can_join_room: false
      - user: user:testrealm/mallory
        object: device:testrealm/dev1
        assertions:
          can_read: false
          can_read_data: false
          can_write_data: false
          can_unregister: false
      - user: user:testrealm/mallory
        object: cluster:astarte
        assertions:
          can_create_realm: false
          can_list_realms: false

  # ======================================================================
  - name: triggers and policies follow the realm's roles
    check:
      - user: user:testrealm/carol
        object: trigger:testrealm/connection
        assertions:
          can_read: true
          can_delete: false
      - user: user:testrealm/alice
        object: trigger:testrealm/connection
        assertions:
          can_read: true
          can_delete: true
      - user: user:testrealm/carol
        object: trigger_policy:testrealm/retry
        assertions:
          can_read: true
          can_delete: false
      - user: user:testrealm/dave
        object: trigger:testrealm/connection
        assertions:
          # the fleet manager has no say over triggers
          can_read: false
          can_delete: false
