name: Build and Test Astarte Libraries

on:
  push:
    paths:
      - "libs/**"
      - ".github/workflows/astarte-libs-build-workflow.yaml"
      - ".github/workflows/astarte-libs-workflow.yml"
      - ".github/codecov.yml"
    branches:
      - "master"
      - "release-[0-9]+.[0-9]+"
  create:
  pull_request:
    paths:
      - "libs/**"
      - ".github/workflows/astarte-libs-build-workflow.yaml"
      - ".github/workflows/astarte-libs-workflow.yml"
      - ".github/codecov.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  astarte_core:
    uses: ./.github/workflows/astarte-libs-build-workflow.yaml
    with:
      lib: "astarte_core"
    secrets: inherit
  astarte_generators:
    uses: ./.github/workflows/astarte-libs-build-workflow.yaml
    with:
      lib: "astarte_generators"
    secrets: inherit
  astarte_fdo_core:
    uses: ./.github/workflows/astarte-libs-build-workflow.yaml
    with:
      lib: "astarte_fdo_core"
    secrets: inherit
